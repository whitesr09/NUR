name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "android-icon/**"
      - "package.json"
      - "capacitor.config.json"
      - "signing/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUR_SIGNING_PASSWORD: ${{ secrets.NUR_SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Require permanent signing secret
        shell: bash
        run: |
          if [ -z "$NUR_SIGNING_PASSWORD" ]; then
            echo "::error::Repository secret NUR_SIGNING_PASSWORD is missing."
            exit 1
          fi

      - name: Restore permanent NUR signing key
        shell: bash
        run: |
          mkdir -p signing/runtime
          base64 -d signing/nur-release.p12.b64 > signing/runtime/nur-release.p12
          keytool -list \
            -storetype PKCS12 \
            -keystore signing/runtime/nur-release.p12 \
            -storepass "$NUR_SIGNING_PASSWORD" \
            -alias nur-release >/dev/null

      - name: Install dependencies
        run: npm install

      - name: Prepare crisp loading artwork
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          p=Path('web/assets/loading-bg.jpg')
          im=Image.open(p).convert('RGB')
          # Pre-render near phone resolution so Android WebView does not magnify
          # the small JPEG directly, which caused visible blockiness.
          target=(1080,1920)
          im=im.resize(target,Image.Resampling.LANCZOS)
          im=im.filter(ImageFilter.UnsharpMask(radius=1.0,percent=70,threshold=3))
          im.save(p,quality=94,optimize=True,progressive=True)
          print('Prepared loading background:', p, im.size)
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Apply crisp NUR launcher icon
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src_path=Path('android-icon/nur-app-icon.png')
          if not src_path.exists():
              raise SystemExit('Missing android-icon/nur-app-icon.png')
          src=Image.open(src_path).convert('RGBA')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          root=Path('android/app/src/main/res')
          for density,size in sizes.items():
              dest=root/f'mipmap-{density}'
              dest.mkdir(parents=True,exist_ok=True)
              for old in ['ic_launcher.webp','ic_launcher_round.webp','ic_launcher.jpg','ic_launcher_round.jpg']:
                  q=dest/old
                  if q.exists(): q.unlink()
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(dest/'ic_launcher.png',optimize=True)
              icon.save(dest/'ic_launcher_round.png',optimize=True)
          # Do not let Capacitor's adaptive foreground/background override the
          # user's supplied artwork on Android 8+.
          for name in ['mipmap-anydpi-v26/ic_launcher.xml','mipmap-anydpi-v26/ic_launcher_round.xml']:
              q=root/name
              if q.exists(): q.unlink()
          print('Launcher icons generated from lossless PNG source')
          PY

      - name: Remove native white launch flash
        shell: bash
        run: |
          ROOT="android/app/src/main/res"
          mkdir -p "$ROOT/drawable" "$ROOT/values-v31"
          cat > "$ROOT/drawable/nur_launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#020817" />
          </shape>
          XML
          cat > "$ROOT/drawable/nur_transparent.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp" android:height="1dp"
              android:viewportWidth="1" android:viewportHeight="1">
              <path android:fillColor="#00000000" android:pathData="M0,0h1v1h-1z" />
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/res/values/styles.xml')
          s=p.read_text()
          # Capacitor normally points the launch theme to @drawable/splash.
          # Replace that starting window with NUR navy so no white frame can
          # appear while the WebView is being created.
          s=s.replace('@drawable/splash','@drawable/nur_launch_background')
          if 'android:windowBackground' not in s:
              s=s.replace('</style>\n\n    <style name="AppTheme.NoActionBarLaunch"', '</style>\n\n    <style name="AppTheme.NoActionBarLaunch"',1)
          launch=re.search(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)',s,re.S)
          if launch:
              body=launch.group(2)
              if 'android:windowBackground' not in body:
                  body += '\n        <item name="android:windowBackground">@drawable/nur_launch_background</item>'
              repl=launch.group(1)+body+launch.group(3)
              s=s[:launch.start()]+repl+s[launch.end():]
          p.write_text(s)
          PY
          cat > "$ROOT/values-v31/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#020817</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/nur_transparent</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                  <item name="android:windowBackground">@drawable/nur_launch_background</item>
              </style>
          </resources>
          XML

      - name: Set monotonic Android version
        shell: bash
        run: |
          VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}"
          python3 - <<PY
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode ${VERSION_CODE}', s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "${VERSION_NAME}"', s)
          p.write_text(s)
          PY
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Align and sign release APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/NUR-v2-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/NUR-v2.apk"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -f "$UNSIGNED"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks signing/runtime/nur-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias nur-release \
            --ks-pass env:NUR_SIGNING_PASSWORD \
            --key-pass env:NUR_SIGNING_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-v2-signed-APK
          path: android/app/build/outputs/apk/release/NUR-v2.apk
          if-no-files-found: error
